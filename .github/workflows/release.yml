name: Build & Release

on:
  # Automatic: push a version tag like v1.0.2
  push:
    tags:
      - 'v*'
  # Manual: Actions → Build & Release → Run workflow
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (e.g. 1.0.2). Leave empty to use package.json.'
        required: false
        type: string
      force_rebuild:
        description: 'Force rebuild & REPLACE AppImage (changes file HASH). Keep OFF for normal releases.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      needs_build: ${{ steps.ver.outputs.needs_build }}
      skip_reason: ${{ steps.ver.outputs.skip_reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version & hash-freeze check
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi

          TAG="v${VERSION}"
          FORCE="${{ inputs.force_rebuild }}"
          if [[ -z "${FORCE}" || "${FORCE}" == "null" ]]; then FORCE="false"; fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION} (tag ${TAG}), force_rebuild=${FORCE}"

          # Portable BETA tags are published manually (Windows zip). Do not rebuild Linux or mark latest.
          if [[ "${VERSION}" =~ [Bb]eta|[Rr][Cc]|[Pp]re ]]; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=BETA/RC tag ${TAG}: skip Linux AppImage job. Upload the portable zip with gh release (prerelease, not latest)."
            echo "::notice::Skipping CI package for BETA tag ${TAG}"
            exit 0
          fi

          # Public GitHub releases are Linux AppImage only (no Windows setup/uninstall — SAC / Store).
          # Re-uploading the same filename with a new binary changes SHA-256 — ship each version once.
          HAS_LINUX="false"
          if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            ASSETS="$(gh release view "${TAG}" --repo "${{ github.repository }}" --json assets -q '.assets[].name' 2>/dev/null || true)"
            echo "Existing release assets:"
            echo "${ASSETS}"
            if echo "${ASSETS}" | grep -qiE '\.AppImage$'; then HAS_LINUX="true"; fi
          else
            echo "No release for ${TAG} yet."
          fi

          if [[ "${FORCE}" != "true" && "${HAS_LINUX}" == "true" ]]; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=Release ${TAG} already has a Linux AppImage. Hash frozen. Use force_rebuild only if you intentionally want a new hash." >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping rebuild — preserving AppImage hash for ${TAG}"
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            if [[ "${FORCE}" == "true" && "${HAS_LINUX}" == "true" ]]; then
              echo "skip_reason=force_rebuild: will REPLACE existing AppImage (new hash)." >> "$GITHUB_OUTPUT"
              echo "::warning::force_rebuild is ON — AppImage hash for this version will change."
            else
              echo "skip_reason=" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-linux:
    name: Build Linux x64 (AppImage)
    needs: resolve-version
    if: needs.resolve-version.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set package version
        run: npm version "${{ needs.resolve-version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build app (Vite + Electron compile)
        run: npm run build

      - name: Package Linux AppImage (electron-builder)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CI: 'true'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage --x64 --publish never

      - name: List artifacts + SHA-256 (freeze this hash)
        run: |
          ls -la release
          echo "=== SHA-256 (publish once, do not replace) ==="
          sha256sum release/*.{AppImage,yml,blockmap} 2>/dev/null || sha256sum release/* || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eg-launcher-linux-x64
          path: |
            release/*.AppImage
            release/latest-linux.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: [resolve-version, build-linux]
    if: always() && needs.resolve-version.result == 'success' && (needs.resolve-version.outputs.needs_build != 'true' || needs.build-linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Hash frozen — nothing to upload
        if: needs.resolve-version.outputs.needs_build != 'true'
        run: |
          echo "${{ needs.resolve-version.outputs.skip_reason }}"
          echo "Release ${{ needs.resolve-version.outputs.tag }} AppImage is frozen (same SHA until force_rebuild)."

      - name: Checkout (for CHANGELOG.md)
        if: needs.resolve-version.outputs.needs_build == 'true'
        uses: actions/checkout@v4

      - name: Download Linux build artifacts
        if: needs.resolve-version.outputs.needs_build == 'true'
        uses: actions/download-artifact@v4
        with:
          name: eg-launcher-linux-x64
          path: artifacts

      - name: Keep only AppImage + Linux updater metadata
        if: needs.resolve-version.outputs.needs_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          # Drop any accidental Windows leftovers
          rm -f ./*.exe ./*setup* ./*uninstall* ./latest.yml ./builder-debug.yml 2>/dev/null || true
          find . -type f | sort
          echo "=== SHA-256 ==="
          find . -type f -print0 | xargs -0 sha256sum

      - name: Build release notes from CHANGELOG.md
        if: needs.resolve-version.outputs.needs_build == 'true'
        id: notes
        shell: bash
        run: |
          node scripts/extract-changelog.mjs "${{ needs.resolve-version.outputs.version }}" release-notes.md
          echo "---- release-notes.md ----"
          cat release-notes.md

      - name: Publish GitHub Release (Linux AppImage only)
        if: needs.resolve-version.outputs.needs_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: EG Launcher ${{ needs.resolve-version.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
          files: |
            artifacts/*.AppImage
            artifacts/latest-linux.yml
            artifacts/*.blockmap
          fail_on_unmatched_files: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove Windows setup/uninstall from this release (if any)
        if: needs.resolve-version.outputs.needs_build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve-version.outputs.tag }}"
          ASSETS="$(gh release view "${TAG}" --repo "${{ github.repository }}" --json assets -q '.assets[].name' 2>/dev/null || true)"
          echo "Assets before cleanup:"
          echo "${ASSETS}"
          while IFS= read -r name; do
            [[ -z "${name}" ]] && continue
            # Strip Windows NSIS/updater leftovers; keep Store .appx/.msix if uploaded for Partner Center.
            if echo "${name}" | grep -qiE '\.(exe)$|uninstall|latest\.yml$|builder-debug'; then
              echo "Deleting asset: ${name}"
              gh release delete-asset "${TAG}" "${name}" --repo "${{ github.repository }}" --yes || true
            elif echo "${name}" | grep -qiE 'setup' && ! echo "${name}" | grep -qiE '\.(appx|msix)$'; then
              echo "Deleting asset: ${name}"
              gh release delete-asset "${TAG}" "${name}" --repo "${{ github.repository }}" --yes || true
            fi
          done <<< "${ASSETS}"
          echo "Assets after cleanup:"
          gh release view "${TAG}" --repo "${{ github.repository }}" --json assets -q '.assets[].name' || true

      - name: Release summary
        if: always()
        run: |
          {
            echo "## EG Launcher ${{ needs.resolve-version.outputs.tag }}"
            echo ""
            echo "### GitHub (public)"
            echo "- **Linux AppImage only** (no Windows setup/uninstall)"
            echo "- Windows users: Microsoft Store (when published)"
            echo "- Docs: \`docs/GITHUB-RELEASES.md\`, \`docs/GITHUB-SAC.md\`"
            if [[ "${{ needs.resolve-version.outputs.needs_build }}" != "true" ]]; then
              echo ""
              echo "> Hash frozen — no new AppImage uploaded."
              echo "> ${{ needs.resolve-version.outputs.skip_reason }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
